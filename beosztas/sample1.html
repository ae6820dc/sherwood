<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Havi beosztás - Szent Kristóf Szakrendelő</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .ceg-header {
            text-align: center;
            margin-bottom: 18px;
            border-bottom: 2px solid #1a3c5e;
            padding-bottom: 14px;
        }
        .ceg-header .cegnev {
            font-size: 26px;
            font-weight: 700;
            color: #1a3c5e;
            letter-spacing: 2px;
        }
        .ceg-header .cegnev span { font-weight: 300; color: #4a7a9e; }
        .ceg-header .cegaddress { font-size: 13px; color: #555; margin-top: 2px; }
        .ceg-header .cim {
            font-size: 20px;
            font-weight: 600;
            color: #1a3c5e;
            margin-top: 8px;
        }
        .ceg-header .idoszak { font-size: 14px; color: #555; margin-top: 4px; }
        
        .ceg-header .idoszak input {
            border: none;
            border-bottom: 1.5px dashed #7a9bcb;
            background: transparent;
            padding: 2px 8px;
            font-size: 14px;
            min-width: 150px;
            text-align: center;
            cursor: pointer;
            pointer-events: none;
            opacity: 0.6;
        }
        .ceg-header .idoszak input.engedelyezett {
            pointer-events: auto;
            opacity: 1;
            cursor: pointer;
        }
        .ceg-header .idoszak input:focus {
            outline: none;
            border-bottom: 2px solid #1a3c5e;
        }

        .table-wrap {
            overflow-x: auto;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #d0dbe8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 800px;
        }
        
        th, td {
            border: 1px solid #d0dbe8;
            padding: 2px 4px;
            text-align: center;
            vertical-align: middle;
            height: 48px;
            min-width: 30px;
        }
        th {
            background: #1a3c5e;
            color: white;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            user-select: none;
        }
        th:first-child {
            min-width: 160px;
            position: sticky;
            left: 0;
            z-index: 5;
            background: #1a3c5e;
            cursor: default;
        }
        td:first-child {
            min-width: 160px;
            position: sticky;
            left: 0;
            z-index: 3;
            background: #f8faff;
            font-weight: 600;
            color: #1a3c5e;
            text-align: left;
            padding: 2px 6px;
            border-right: 2px solid #1a3c5e;
        }

        td input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 2px 4px;
            text-align: center;
            font-size: 12px;
            font-family: inherit;
            border-radius: 3px;
            min-height: 30px;
            vertical-align: middle;
            pointer-events: none;
            opacity: 0.6;
        }
        td input.engedelyezett {
            pointer-events: auto;
            opacity: 1;
        }
        td input:focus {
            outline: 2px solid #1a3c5e;
            background: #fffbe6;
        }
        td input::placeholder { color: #ccc; font-style: italic; font-size: 10px; }

        .nev-cell {
            display: flex;
            align-items: center;
            padding: 0;
            width: 100%;
            height: 44px;
            gap: 4px;
        }
        .nev-sorszam {
            font-size: 12px;
            color: #1a3c5e;
            font-weight: 700;
            min-width: 25px;
            text-align: right;
            flex-shrink: 0;
            user-select: none;
        }
        .nev-input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 2px 4px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            color: #000;
            text-align: left;
            min-height: 28px;
            line-height: 1.3;
            vertical-align: middle;
            flex: 1;
            pointer-events: none;
            opacity: 0.6;
        }
        .nev-input.engedelyezett {
            pointer-events: auto;
            opacity: 1;
        }
        .nev-input:focus {
            outline: 2px solid #1a3c5e;
            background: #fffbe6;
        }
        .nev-input::placeholder { color: #bbb; font-style: italic; font-weight: 400; font-size: 9px; }

        .col-white td, .col-white td input { background: transparent; }
        .col-green td { background: #b7e4b7; }
        .col-red td { background: #f7b0b0; }
        .col-yellow td { background: #f7e68a; }
        .col-green td:first-child { background: #a0d0a0; }
        .col-red td:first-child { background: #e8a0a0; }
        .col-yellow td:first-child { background: #e8d07a; }
        .col-white td:first-child { background: #f8faff; }
        .col-green th { background: #2a7a3a; }
        .col-red th { background: #8a2a2a; }
        .col-yellow th { background: #8a7a2a; }
        .col-green .nev-sorszam { color: #1a4a2a; }
        .col-red .nev-sorszam { color: #6a1a1a; }
        .col-yellow .nev-sorszam { color: #6a5a1a; }
        .col-white .nev-sorszam { color: #1a3c5e; }

        .hetvege { background: #f5f0eb; }
        .hetvege th { background: #2a4a6a; }

        .felirat { font-size: 8px; color: #aaa; display: block; font-weight: 400; margin-top: 1px; }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 20px 0 8px;
        }
        .actions button {
            padding: 8px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            background: #1a3c5e;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .actions button:hover { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(26,60,94,0.3); }
        .actions button.print { background: #2a6d4a; }
        .actions button.print:hover { background: #1d5236; }
        .actions button.edit { background: #8d6c3f; }
        .actions button.edit:hover { background: #6e522f; }
        .actions button.save-close { background: #c0392b; }
        .actions button.save-close:hover { background: #962d22; }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #777;
            margin-top: 14px;
            border-top: 1px solid #dde3ed;
            padding-top: 12px;
        }

        .password-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            justify-content: center; align-items: center;
        }
        .password-overlay.active { display: flex; }
        .password-modal {
            background: white; padding: 30px 35px; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; max-width: 380px; width: 90%;
        }
        .password-modal h2 { font-size: 20px; color: #1a3c5e; margin-bottom: 6px; }
        .password-modal p { color: #666; font-size: 14px; margin-bottom: 16px; }
        .password-modal input {
            width: 100%; padding: 10px 14px; font-size: 18px; text-align: center;
            border: 2px solid #d0dbe8; border-radius: 6px; outline: none; transition: 0.2s; letter-spacing: 4px;
        }
        .password-modal input:focus { border-color: #1a3c5e; }
        .password-modal .modal-buttons { display: flex; gap: 10px; margin-top: 14px; justify-content: center; }
        .password-modal .modal-buttons button {
            padding: 8px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .password-modal .modal-buttons .confirm { background: #8d6c3f; color: white; }
        .password-modal .modal-buttons .confirm:hover { background: #6e522f; }
        .password-modal .modal-buttons .cancel { background: #ccc; color: #333; }
        .password-modal .modal-buttons .cancel:hover { background: #bbb; }
        .password-modal .error-msg { color: #d32f2f; font-size: 13px; margin-top: 8px; display: none; }
        .password-modal .error-msg.show { display: block; }

        @media print {
            body { background: white; padding: 0; margin: 0; }
            .container { box-shadow: none; padding: 8px 10px; border-radius: 0; max-width: 100%; }
            .actions, .footer-note { display: none !important; }
            .password-overlay { display: none !important; }
            
            table {
                border-collapse: separate !important;
                border-spacing: 1px !important;
                border: 1px solid #000 !important;
            }

            th, td {
                border: 1px solid #000 !important;
            }
            
            th:first-child, td:first-child {
                border: 1px solid #000 !important;
                border-right: 2px solid #000 !important;
            }
            
            td input, .nev-input {
                border: none !important;
                background: transparent !important;
                outline: none !important;
                color: #000 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                pointer-events: none !important;
                opacity: 1 !important;
            }
            .nev-input::placeholder, td input::placeholder {
                color: transparent !important;
            }
            
            th, td { height: 48px !important; min-height: 48px !important; }
            
            .nev-sorszam {
                font-size: 11px !important;
                color: #000 !important;
                font-weight: 700 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .nev-input {
                font-size: 12px !important;
                font-weight: 600 !important;
                color: #000 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            
            .col-green td, .col-green td:first-child { background: #a0d0a0 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .col-red td, .col-red td:first-child { background: #e8a0a0 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .col-yellow td, .col-yellow td:first-child { background: #e8d07a !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .col-white td:first-child { background: #f8faff !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .col-green th { background: #2a7a3a !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .col-red th { background: #8a2a2a !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .col-yellow th { background: #8a7a2a !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .hetvege, .hetvege th { background: #f5f0eb !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .col-green .nev-sorszam { color: #1a4a2a !important; }
            .col-red .nev-sorszam { color: #6a1a1a !important; }
            .col-yellow .nev-sorszam { color: #6a5a1a !important; }
            .col-white .nev-sorszam { color: #000 !important; }
            
            .ceg-header { border-bottom-color: #1a3c5e !important; margin-bottom: 10px !important; padding-bottom: 10px !important; }
            .ceg-header .cegnev { font-size: 22px !important; }
            .ceg-header .cim { font-size: 18px !important; margin-top: 4px !important; }
            .ceg-header .idoszak { font-size: 12px !important; }
            .ceg-header .idoszak input { border-bottom: 1px solid #999 !important; font-size: 12px !important; min-width: 120px !important; color: #000 !important; pointer-events: none !important; opacity: 1 !important; }
        }

        @media (max-width: 700px) {
            .container { padding: 10px 5px; }
            .ceg-header .cegnev { font-size: 18px; }
            table { font-size: 10px; min-width: 600px; }
            th:first-child, td:first-child { min-width: 100px; font-size: 10px; padding: 2px 4px; height: 42px; }
            th, td { height: 42px; padding: 2px 3px; }
            td input { font-size: 10px; min-height: 24px; }
            .nev-input { font-size: 11px; min-height: 24px; font-weight: 600; }
            .nev-cell { min-height: 38px; height: 38px; gap: 2px; }
            .nev-sorszam { font-size: 10px; min-width: 18px; font-weight: 700; }
            th { font-size: 9px; padding: 4px 2px; height: 42px; }
            th:first-child { min-width: 100px; }
        }
    </style>
</head>
<body>

<div class="container" id="beosztasIv">
    <div class="ceg-header">
        <div class="cegnev">SZENT KRISTÓF <span>SZAKRENDELŐ</span></div>
        <div class="cegaddress">BUDAPEST • ÚJBUDA</div>
        <div class="cim">📋 Havi beosztás</div>
        <div class="idoszak">
            Hónap: <input type="month" id="honapValaszto" value="2026-08">
        </div>
    </div>

    <div class="table-wrap">
        <table id="beosztasTabla">
            <thead>
                <tr id="fejlecSor">
                    <th>Név / Dátum</th>
                </tr>
            </thead>
            <tbody id="tablaTest"></tbody>
        </table>
    </div>

    <div class="actions">
        <button id="editToggleBtn" class="edit" onclick="szerkesztesGombKattintas()">✏️ Szerkesztés</button>
        <button class="print" onclick="window.print()">🖨️ Nyomtatás</button>
    </div>

    <div class="footer-note">⚡ Szerkesztéshez kattints a gombra · Kattints a nap számára az oszlop színének váltásához</div>
</div>

<!-- JELSZÓ MODAL -->
<div class="password-overlay" id="passwordOverlay">
    <div class="password-modal">
        <h2>🔒 Jelszó szükséges</h2>
        <p id="jelszoUzenet">Add meg a jelszót a szerkesztés megkezdéséhez</p>
        <input type="password" id="jelszoInput" placeholder="●●●●" maxlength="4" autocomplete="off">
        <div class="error-msg" id="errorMsg">❌ Hibás jelszó! Próbáld újra.</div>
        <div class="modal-buttons">
            <button class="cancel" onclick="jelszoModalBezar()">Mégse</button>
            <button class="confirm" onclick="jelszoEllenorzes()">Jóváhagyás</button>
        </div>
    </div>
</div>

<script>
    (function() {
        const STORAGE_KEY = 'havi_beosztas_data_v11';
        const JELSZO = '1111';
        const SOROK_SZAMA = 12;
        const SZIN_CKLUS = ['white', 'green', 'red', 'yellow'];

        let aktualisEv = 2026;
        let aktualisHo = 7;
        let sorok = [];
        let oszlopSzinek = {};
        let szerkesztesEngedelyezve = false;

        function getNapokSzama(ev, ho) { return new Date(ev, ho + 1, 0).getDate(); }
        function getHetNapja(ev, ho, nap) { return new Date(ev, ho, nap).getDay(); }
        function kovetkezoSzin(jelenlegi) {
            const index = SZIN_CKLUS.indexOf(jelenlegi);
            if (index === -1 || index === SZIN_CKLUS.length - 1) return SZIN_CKLUS[0];
            return SZIN_CKLUS[index + 1];
        }

        function letrehozSorokat(meglevoSorok) {
            const napokSzama = getNapokSzama(aktualisEv, aktualisHo);
            const ujSorok = [];
            for (let i = 0; i < SOROK_SZAMA; i++) {
                if (meglevoSorok && i < meglevoSorok.length) {
                    const regi = meglevoSorok[i];
                    const napok = {};
                    for (let d = 1; d <= napokSzama; d++) {
                        napok[d] = (regi.napok && regi.napok[d] !== undefined) ? regi.napok[d] : '';
                    }
                    ujSorok.push({ nev: regi.nev || '', napok: napok });
                } else {
                    const napok = {};
                    for (let d = 1; d <= napokSzama; d++) napok[d] = '';
                    ujSorok.push({ nev: '', napok: napok });
                }
            }
            return ujSorok;
        }

        function initOszlopSzinek() {
            const napokSzama = getNapokSzama(aktualisEv, aktualisHo);
            for (let d = 1; d <= napokSzama; d++) {
                if (oszlopSzinek[d] === undefined) oszlopSzinek[d] = 'white';
            }
        }

        function mentes() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ sorok, oszlopSzinek, aktualisEv, aktualisHo }));
            } catch(e) {}
        }

        function betoltes() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    if (data.sorok && Array.isArray(data.sorok)) {
                        sorok = data.sorok;
                        if (data.oszlopSzinek) oszlopSzinek = data.oszlopSzinek;
                        if (data.aktualisEv !== undefined) aktualisEv = data.aktualisEv;
                        if (data.aktualisHo !== undefined) aktualisHo = data.aktualisHo;
                        return true;
                    }
                }
            } catch(e) {}
            return false;
        }

        function renderTabla() {
            const tbody = document.getElementById('tablaTest');
            const fejlec = document.getElementById('fejlecSor');
            if (!tbody || !fejlec) return;

            const napokSzama = getNapokSzama(aktualisEv, aktualisHo);
            initOszlopSzinek();

            fejlec.innerHTML = '<th>Név / Dátum</th>';
            for (let d = 1; d <= napokSzama; d++) {
                const th = document.createElement('th');
                const napNeve = getHetNapja(aktualisEv, aktualisHo, d);
                const rovidNap = ['V', 'H', 'K', 'Sze', 'Cs', 'P', 'Szo'][napNeve];
                th.innerHTML = `${d}<span class="felirat">${rovidNap}</span>`;
                th.dataset.nap = d;
                
                const szin = oszlopSzinek[d] || 'white';
                if (szin !== 'white') th.style.background = getSzinHexa(szin);
                else if (napNeve === 0 || napNeve === 6) th.style.background = '#2a4a6a';
                
                th.addEventListener('click', function(e) {
                    e.stopPropagation();
                    oszlopKattintas(parseInt(this.dataset.nap, 10));
                });
                fejlec.appendChild(th);
            }

            if (sorok.length !== SOROK_SZAMA) {
                sorok = letrehozSorokat(sorok);
            } else {
                const aktNapokSzama = getNapokSzama(aktualisEv, aktualisHo);
                sorok.forEach(sor => {
                    if (!sor.napok) sor.napok = {};
                    for (let d = 1; d <= aktNapokSzama; d++) {
                        if (sor.napok[d] === undefined) sor.napok[d] = '';
                    }
                });
            }

            tbody.innerHTML = '';
            sorok.forEach((sor, sorIndex) => {
                const tr = document.createElement('tr');
                tr.dataset.index = sorIndex;

                const tdNev = document.createElement('td');
                const divNev = document.createElement('div');
                divNev.className = 'nev-cell';
                
                const sorszamSpan = document.createElement('span');
                sorszamSpan.className = 'nev-sorszam';
                sorszamSpan.textContent = (sorIndex + 1) + '.';
                divNev.appendChild(sorszamSpan);
                
                const inpNev = document.createElement('input');
                inpNev.type = 'text';
                inpNev.className = 'nev-input';
                inpNev.value = sor.nev || '';
                inpNev.placeholder = 'Név';
                inpNev.dataset.sor = sorIndex;
                inpNev.dataset.field = 'nev';
                inpNev.addEventListener('input', function() {
                    sorok[sorIndex].nev = this.value;
                    mentes();
                });
                
                if (!szerkesztesEngedelyezve) {
                    inpNev.classList.remove('engedelyezett');
                } else {
                    inpNev.classList.add('engedelyezett');
                }
                divNev.appendChild(inpNev);
                tdNev.appendChild(divNev);
                tr.appendChild(tdNev);

                for (let d = 1; d <= napokSzama; d++) {
                    const td = document.createElement('td');
                    td.dataset.nap = d;
                    
                    const szin = oszlopSzinek[d] || 'white';
                    if (szin !== 'white') td.style.background = getSzinHexa(szin);
                    else {
                        const napNeve = getHetNapja(aktualisEv, aktualisHo, d);
                        if (napNeve === 0 || napNeve === 6) td.style.background = '#f5f0eb';
                    }
                    
                    const inp = document.createElement('input');
                    inp.type = 'text';
                    inp.value = sor.napok[d] || '';
                    inp.placeholder = '';
                    inp.dataset.sor = sorIndex;
                    inp.dataset.nap = d;
                    inp.addEventListener('input', function() {
                        sorok[sorIndex].napok[d] = this.value;
                        mentes();
                    });

                    if (!szerkesztesEngedelyezve) {
                        inp.classList.remove('engedelyezett');
                    } else {
                        inp.classList.add('engedelyezett');
                    }
                    td.appendChild(inp);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            });

            const honapInput = document.getElementById('honapValaszto');
            if (honapInput) {
                const hoStr = String(aktualisHo + 1).padStart(2, '0');
                honapInput.value = `${aktualisEv}-${hoStr}`;
                
                if (szerkesztesEngedelyezve) {
                    honapInput.classList.add('engedelyezett');
                } else {
                    honapInput.classList.remove('engedelyezett');
                }
            }
            mentes();
            
            // Gomb állapot frissítése
            frissitGombot();
        }

        function getSzinHexa(szin) {
            return {'white':'#ffffff','green':'#b7e4b7','red':'#f7b0b0','yellow':'#f7e68a'}[szin] || '#ffffff';
        }

        function oszlopKattintas(nap) {
            if (!nap || !szerkesztesEngedelyezve) return;
            const aktSzin = oszlopSzinek[nap] || 'white';
            const ujSzin = kovetkezoSzin(aktSzin);
            oszlopSzinek[nap] = ujSzin;
            
            const th = document.querySelector(`#fejlecSor th[data-nap="${nap}"]`);
            if (th) {
                if (ujSzin !== 'white') th.style.background = getSzinHexa(ujSzin);
                else {
                    const napNeve = getHetNapja(aktualisEv, aktualisHo, nap);
                    th.style.background = (napNeve === 0 || napNeve === 6) ? '#2a4a6a' : '#1a3c5e';
                }
            }
            
            const cellak = document.querySelectorAll(`#tablaTest td[data-nap="${nap}"]`);
            cellak.forEach(td => {
                if (ujSzin !== 'white') td.style.background = getSzinHexa(ujSzin);
                else {
                    const napNeve = getHetNapja(aktualisEv, aktualisHo, nap);
                    td.style.background = (napNeve === 0 || napNeve === 6) ? '#f5f0eb' : '#ffffff';
                }
            });
            mentes();
        }

        function valtoztatHonap(ev, ho) {
            aktualisEv = ev; aktualisHo = ho;
            oszlopSzinek = {}; initOszlopSzinek();
            const napokSzama = getNapokSzama(ev, ho);
            sorok.forEach(sor => {
                if (!sor.napok) sor.napok = {};
                for (let d = 1; d <= napokSzama; d++) {
                    if (sor.napok[d] === undefined) sor.napok[d] = '';
                }
            });
            renderTabla();
            mentes();
        }

        function frissitGombot() {
            const gomb = document.getElementById('editToggleBtn');
            if (szerkesztesEngedelyezve) {
                gomb.textContent = '🔒 Mentés és bezárás';
                gomb.className = 'save-close';
            } else {
                gomb.textContent = '✏️ Szerkesztés';
                gomb.className = 'edit';
            }
        }

        // --- GOMB KEZELÉS ---
        window.szerkesztesGombKattintas = function() {
            if (szerkesztesEngedelyezve) {
                // Ha már szerkesztésben vagyunk, lezárjuk
                szerkesztesEngedelyezve = false;
                renderTabla();
            } else {
                // Ha zárt, jelszót kérünk
                document.getElementById('jelszoUzenet').innerText = 'Add meg a jelszót a szerkesztés megkezdéséhez';
                document.getElementById('passwordOverlay').classList.add('active');
                document.getElementById('jelszoInput').value = '';
                document.getElementById('errorMsg').classList.remove('show');
                document.getElementById('jelszoInput').focus();
            }
        };

        window.jelszoModalBezar = function() {
            document.getElementById('passwordOverlay').classList.remove('active');
            document.getElementById('jelszoInput').value = '';
            document.getElementById('errorMsg').classList.remove('show');
        };

        window.jelszoEllenorzes = function() {
            const jelszo = document.getElementById('jelszoInput').value;
            
            // Ha véletlenül szerkesztés közben próbálják megnyitni, figyelmeztetünk
            if (szerkesztesEngedelyezve) {
                document.getElementById('jelszoUzenet').innerText = '⚠️ Már szerkesztési módban vagy! Kattints a "Mentés és bezárás" gombra a lezáráshoz.';
                document.getElementById('errorMsg').classList.remove('show');
                document.getElementById('jelszoInput').value = '';
                return;
            }
            
            if (jelszo === JELSZO) {
                document.getElementById('passwordOverlay').classList.remove('active');
                document.getElementById('jelszoInput').value = '';
                document.getElementById('errorMsg').classList.remove('show');
                
                szerkesztesEngedelyezve = true;
                renderTabla();
            } else {
                document.getElementById('errorMsg').classList.add('show');
                document.getElementById('jelszoInput').value = '';
                document.getElementById('jelszoInput').focus();
            }
        };

        document.getElementById('jelszoInput')?.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') jelszoEllenorzes();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') jelszoModalBezar();
        });
        document.getElementById('passwordOverlay')?.addEventListener('click', function(e) {
            if (e.target === this) jelszoModalBezar();
        });

        document.getElementById('honapValaszto')?.addEventListener('change', function() {
            if (szerkesztesEngedelyezve) {
                const [evStr, hoStr] = this.value.split('-');
                const ev = parseInt(evStr, 10); const ho = parseInt(hoStr, 10) - 1;
                if (!isNaN(ev) && !isNaN(ho) && ho >= 0 && ho <= 11) valtoztatHonap(ev, ho);
            }
        });

        const betoltott = betoltes();
        if (!betoltott || sorok.length !== SOROK_SZAMA) {
            sorok = letrehozSorokat(null); oszlopSzinek = {}; initOszlopSzinek();
        } else {
            const napokSzama = getNapokSzama(aktualisEv, aktualisHo);
            sorok.forEach(sor => {
                if (!sor.napok) sor.napok = {};
                for (let d = 1; d <= napokSzama; d++) {
                    if (sor.napok[d] === undefined) sor.napok[d] = '';
                }
            });
            initOszlopSzinek();
        }
        renderTabla();
    })();
</script>
</body>
</html>
